openapi: 3.0.3

info:
  title: Contrato Discografia API
  description: API for managing discography contracts.
  version: 1.1.0

servers:
  - url: https://api.example.com
    description: Production server

security:
  - bearerAuth: []

paths:

  /contrato_discografia:

    get:
      summary: List discography contracts
      operationId: listContratoDiscografia

      parameters:
        - $ref: "#/components/parameters/ArtistIdQuery"
        - $ref: "#/components/parameters/StatusQuery"

      responses:

        "200":
          description: Discography contracts found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContratoDiscografia"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a discography contract
      operationId: postContratoDiscografia

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoDiscografiaRequest"

      responses:

        "201":
          description: Contract created.
          headers:
            Location:
              description: URI of the created contract.
              schema:
                type: string
              example: "/contrato_discografia/12345"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoDiscografia"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "409":
          $ref: "#/components/responses/Conflict"

        "422":
          $ref: "#/components/responses/InvalidReference"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /contrato_discografia/{contract_id}:

    parameters:
      - $ref: "#/components/parameters/ContractId"

    get:
      summary: Get a discography contract
      operationId: getContratoDiscografia

      responses:

        "200":
          description: Contract found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoDiscografia"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update a discography contract
      operationId: putContratoDiscografia

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoDiscografiaRequest"

      responses:

        "200":
          description: Contract successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoDiscografia"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          $ref: "#/components/responses/Conflict"

        "422":
          $ref: "#/components/responses/InvalidReference"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  parameters:

    ContractId:
      name: contract_id
      in: path
      required: true
      description: Unique internal identifier of the contract.

      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12345

    ArtistIdQuery:
      name: artist_id
      in: query
      required: false
      description: Filter contracts by artist.

      schema:
        type: integer
        format: int64
        minimum: 1

    StatusQuery:
      name: status
      in: query
      required: false
      description: Filter contracts by status.

      schema:
        $ref: "#/components/schemas/ContractStatus"

  schemas:

    ContractStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]

    ContratoDiscografiaRequest:
      type: object
      required: [artist_id, album_id, release_date, contract_terms]

      properties:

        artist_id:
          type: integer
          format: int64
          minimum: 1
          example: 101

        album_id:
          type: integer
          format: int64
          minimum: 1
          example: 501

        record_label_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          example: 21

        release_date:
          type: string
          format: date
          example: "2026-09-03"

        contract_terms:
          type: string
          minLength: 1
          example: "Discography contract terms..."

        status:
          $ref: "#/components/schemas/ContractStatus"

        start_date:
          type: string
          format: date
          nullable: true
          example: "2026-09-01"

        end_date:
          type: string
          format: date
          nullable: true
          example: "2031-08-31"

    ContratoDiscografia:
      allOf:
        - $ref: "#/components/schemas/ContratoDiscografiaRequest"
        - type: object
          required: [contract_id, artist_name, album_title, created_at, updated_at]

          properties:

            contract_id:
              type: integer
              format: int64
              example: 12345

            artist_name:
              type: string
              readOnly: true
              example: "The Example Band"

            album_title:
              type: string
              readOnly: true
              example: "Greatest Hits"

            record_label_name:
              type: string
              nullable: true
              readOnly: true
              example: "Example Records"

            created_at:
              type: string
              format: date-time
              readOnly: true

            updated_at:
              type: string
              format: date-time
              readOnly: true

    Error:
      type: object
      required: [code, message]

      properties:

        code:
          type: string
          example: "INVALID_REFERENCE"

        message:
          type: string
          example: "album_id does not belong to artist_id."

  responses:

    BadRequest:
      description: Invalid request data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Contract not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: Request conflicts with an existing contract or business rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidReference:
      description: One or more referenced entities do not exist or violate a database relationship.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
