openapi: 3.0.3

info:
  title: Event Location Availability API
  description: >
    API for querying available event locations by date,
    including the daily price for each available date.
  version: 1.1.0

servers:
  - url: https://api.example.com
    description: Production server

security:
  - bearerAuth: []

paths:

  /disponible:

    get:
      summary: Get available event locations
      description: >
        Returns active event locations that are available within the requested
        inclusive date range. Dates with an active HOLD or CONFIRMED booking
        are not returned as available.
      operationId: getDisponibilidad

      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/SiteId"

      responses:

        "200":
          description: Available event locations found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  parameters:

    StartDate:
      name: start_date
      in: query
      required: true
      description: Inclusive start date of the requested availability period.

      schema:
        type: string
        format: date
      example: "2026-10-01"

    EndDate:
      name: end_date
      in: query
      required: true
      description: Inclusive end date of the requested availability period.

      schema:
        type: string
        format: date
      example: "2026-10-31"

    SiteId:
      name: site_id
      in: query
      required: false
      description: Optional site identifier used to restrict the search.

      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:

    AvailabilityResponse:
      type: object
      required: [start_date, end_date, locations]

      properties:

        start_date:
          type: string
          format: date
          example: "2026-10-01"

        end_date:
          type: string
          format: date
          example: "2026-10-31"

        locations:
          type: array
          items:
            $ref: "#/components/schemas/AvailableLocation"

    AvailableLocation:

      type: object
      required: [location_id, location_name, availability]

      properties:

        location_id:
          type: integer
          format: int64
          description: Internal identifier of the site.
          example: 1

        location_name:
          type: string
          example: "Grand Ballroom"

        availability:
          type: array
          items:
            $ref: "#/components/schemas/AvailableDate"

    AvailableDate:

      type: object
      required: [date, price, currency]

      properties:

        date:
          type: string
          format: date
          example: "2026-10-05"

        price:
          type: number
          format: double
          minimum: 0
          description: Daily price for the site on this date.
          example: 2500.00

        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Three-letter currency code.
          example: "USD"

    Error:

      type: object
      required: [code, message]

      properties:

        code:
          type: string
          example: "INVALID_DATE_RANGE"

        message:
          type: string
          example: "end_date must be greater than or equal to start_date."

  responses:

    BadRequest:
      description: Invalid date range or request parameters.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication failed.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
