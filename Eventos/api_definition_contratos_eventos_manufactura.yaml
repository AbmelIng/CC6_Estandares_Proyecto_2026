openapi: 3.0.3

info:
  title: Contrato Manufactura API
  description: API for managing manufacturing contracts.
  version: 1.1.0

servers:
  - url: https://api.example.com
    description: Production server

security:
  - bearerAuth: []

paths:

  /contrato_manufactura:

    get:
      summary: List manufacturing contracts
      operationId: listContratoManufactura

      parameters:
        - $ref: "#/components/parameters/ManufacturerIdQuery"
        - $ref: "#/components/parameters/StatusQuery"

      responses:

        "200":
          description: Manufacturing contracts found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContratoManufactura"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a manufacturing contract
      operationId: postContratoManufactura

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoManufacturaRequest"

      responses:

        "201":
          description: Contract created.
          headers:
            Location:
              description: URI of the created contract.
              schema:
                type: string
              example: "/contrato_manufactura/12345"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoManufactura"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "409":
          $ref: "#/components/responses/Conflict"

        "422":
          $ref: "#/components/responses/InvalidReference"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /contrato_manufactura/{contract_id}:

    parameters:
      - $ref: "#/components/parameters/ContractId"

    get:
      summary: Get a manufacturing contract
      operationId: getContratoManufactura

      responses:

        "200":
          description: Contract found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoManufactura"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update a manufacturing contract
      operationId: putContratoManufactura

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoManufacturaRequest"

      responses:

        "200":
          description: Contract successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoManufactura"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          $ref: "#/components/responses/Conflict"

        "422":
          $ref: "#/components/responses/InvalidReference"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  parameters:

    ContractId:
      name: contract_id
      in: path
      required: true

      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12345

    ManufacturerIdQuery:
      name: manufacturer_id
      in: query
      required: false

      schema:
        type: integer
        format: int64
        minimum: 1

    StatusQuery:
      name: status
      in: query
      required: false

      schema:
        $ref: "#/components/schemas/ContractStatus"

  schemas:

    ContractStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]

    ContratoManufacturaRequest:
      type: object
      required: [manufacturer_id, product_id, release_date, contract_terms]

      properties:

        manufacturer_id:
          type: integer
          format: int64
          minimum: 1
          example: 301

        product_id:
          type: integer
          format: int64
          minimum: 1
          example: 9001

        release_date:
          type: string
          format: date
          example: "2026-09-03"

        contract_terms:
          type: string
          minLength: 1
          example: "Manufacturing contract terms..."

        status:
          $ref: "#/components/schemas/ContractStatus"

        start_date:
          type: string
          format: date
          nullable: true
          example: "2026-09-01"

        end_date:
          type: string
          format: date
          nullable: true
          example: "2027-08-31"

    ContratoManufactura:
      allOf:
        - $ref: "#/components/schemas/ContratoManufacturaRequest"
        - type: object
          required: [contract_id, manufacturer_name, product_title, created_at, updated_at]

          properties:

            contract_id:
              type: integer
              format: int64
              example: 12345

            manufacturer_name:
              type: string
              readOnly: true
              example: "ACME Manufacturing"

            product_title:
              type: string
              readOnly: true
              example: "Product XYZ"

            created_at:
              type: string
              format: date-time
              readOnly: true

            updated_at:
              type: string
              format: date-time
              readOnly: true

    Error:
      type: object
      required: [code, message]

      properties:

        code:
          type: string
          example: "INVALID_REFERENCE"

        message:
          type: string
          example: "product_id does not belong to manufacturer_id."

  responses:

    BadRequest:
      description: Invalid request data.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication failed.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Contract not found.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: Request conflicts with an existing contract or business rule.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidReference:
      description: One or more referenced entities do not exist or violate a database relationship.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
